
services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    volumes:
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      test: ["CMD-SHELL", "awslocal dynamodb describe-table --table-name developer_summary >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Jaeger all-in-one: UI + OTLP collector + storage in-memory.
  # Caminho mais simples pra ver traces local. Em produção seria deploy
  # separado com storage persistente (Cassandra/Elastic).
  jaeger:
    image: jaegertracing/all-in-one:1.60
    ports:
      - "16686:16686"   # UI web
      - "4317:4317"     # OTLP gRPC (interno; exposto só pra debug)
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  processor:
    build: ./services/processor
    depends_on:
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      RAW_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/raw-events
      PROCESSED_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/processed-events
      PROCESSOR_ID: processor-1
      WORKER_COUNT: "2"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_SERVICE_NAME: processor

  aggregator:
    build: ./services/aggregator
    depends_on:
      localstack:
        condition: service_healthy
      jaeger:
        condition: service_started
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      PROCESSED_EVENTS_QUEUE_URL: http://localstack:4566/000000000000/processed-events
      EVENTS_TABLE_NAME: events
      SUMMARY_TABLE_NAME: developer_summary
      EVENTS_GSI_NAME: developer_id-index
      WORKER_COUNT: "2"
      HTTP_PORT: "8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
      OTEL_SERVICE_NAME: aggregator
